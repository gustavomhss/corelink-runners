name: issue-568-required-hit-policy

on:
  pull_request:
    paths:
      - "actions/corelink-memoize/**"
      - ".github/workflows/issue-568-required-hit-policy.yml"

permissions:
  contents: read

concurrency:
  group: issue-568-required-hit-policy-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact PR head checkout
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run focused memoize policy and verifier tests
        run: bash actions/corelink-memoize/test/policy.sh
